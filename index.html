<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samnyx — Engineering &amp; technology</title>
<meta name="description" content="Samnyx — engineering and technology. Coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0D14'/%3E%3Cpath d='M 67 33 A 17 17 0 1 0 50 50 A 17 17 0 1 1 33 67' fill='none' stroke='%23EEF1F6' stroke-width='9'/%3E%3Ccircle cx='79' cy='21' r='7' fill='%23F0B45A'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0A0D14;
    --fg: #EEF1F6;
    --muted: #8A93A6;
    --accent: #F0B45A;
    --line: #1E2433;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 24px;
    gap: 28px;
  }
  .mark { width: 120px; height: 120px; }
  .wordmark {
    margin: 0;
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 600;
    letter-spacing: 0.28em;
    padding-left: 0.28em; /* balances letter-spacing so it stays centred */
    line-height: 1;
  }
  .tagline {
    margin: 0;
    font-size: clamp(16px, 2.6vw, 20px);
    color: var(--fg);
    opacity: 0.9;
    letter-spacing: 0.02em;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .contact a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--muted);
    padding-bottom: 2px;
    font-size: 16px;
  }
  .contact a:hover { border-bottom-color: var(--accent); }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 12px;
    padding: 24px;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--muted);
  }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--fg); }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Samnyx logo">
    <path d="M 67 33 A 17 17 0 1 0 50 50 A 17 17 0 1 1 33 67" fill="none" stroke="#EEF1F6" stroke-width="7"/>
    <circle cx="79" cy="21" r="5.5" fill="#F0B45A"/>
  </svg>
  <h1 class="wordmark">SAMNYX</h1>
  <p class="tagline">Engineering &amp; technology</p>
  <span class="status"><span class="dot" aria-hidden="true"></span>In development</span>
  <p class="contact"><a href="mailto:contact@samnyx.com">contact@samnyx.com</a></p>
</main>
<footer>
  <span>© 2026 Samnyx</span>
  <a href="impressum.html">Impressum &amp; Datenschutz</a>
</footer>
</body>
</html>
